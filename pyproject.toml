[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "req-jev-master"
version = "0.1.0"
description = "JEV-Cascade Reflection Loop for Converting Natural Language Requirements into MASTeR Semi-Formal Templates"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typesafe-sdk>=0.7.5",
    "google-genai>=1.0.0",
    "openai>=1.60.0",
    "pydantic>=2.8.0",
    "jinja2>=3.1.4",
    "scipy>=1.13.0",
    "pandas>=2.2.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
nlp-metrics = [
    "bert-score>=0.3.13",
    "sacrebleu>=2.4.0",
]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
